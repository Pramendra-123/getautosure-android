<!doctype html>
<meta charset="utf-8">
<title>GetAutoSure insert section</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono&display=swap">
<style>html,body{margin:0;width:1600px;height:1000px;background:#F6F4F1}svg{display:block}</style>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 320 200" font-family="IBM Plex Sans">
  <defs>
    <marker id="a" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M0 0 L6 3 L0 6 z" fill="#5E636B"/></marker>
  </defs>
  <style>
    .dim{stroke:#5E636B;stroke-width:.25;marker-start:url(#a);marker-end:url(#a)}
    .t{font-size:3.2px;fill:#14171C}
    .s{font-size:2.6px;fill:#5E636B}
    .m{font-family:"IBM Plex Mono";font-size:2.5px;fill:#5E636B}
    .h{font-family:Sora;font-weight:700;font-size:6px;fill:#14171C}
    .warn{font-family:"IBM Plex Mono";font-size:2.6px;fill:#D4380D}
  </style>
  <text x="10" y="14" class="h">Inside the box: insert layout</text>
  <text x="10" y="21" class="s">Drawn to scale in mm. Dongle sizes are assumed from a typical ELM327 shell. Vendor to confirm against the real part.</text>

  <!-- ===== SIDE SECTION (front of box on the right) ===== -->
  <g transform="translate(40 40)">
    <text x="0" y="-6" class="t" font-weight="600">Side cut-through</text>
    <!-- box walls, 25.5 x 100 outside -->
    <rect x="0" y="0" width="25.5" height="100" fill="none" stroke="#14171C" stroke-width=".9"/>
    <!-- orange back wall + pull tab -->
    <rect x="0.95" y="13.55" width="0.6" height="86" fill="#FF6B2C"/>
    <path d="M0.95 13.55 v-10 h0.6 v10 z" fill="#FF6B2C"/>
    <!-- card + sticker -->
    <rect x="0.5" y="4.55" width="0.35" height="95" fill="#14171C"/>
    <rect x="1.6" y="40" width="0.25" height="50" fill="#5E636B"/>
    <!-- riser block -->
    <rect x="1.95" y="73.55" width="23.1" height="26" fill="#FF6B2C" stroke="#C94C17" stroke-width=".3"/>
    <!-- dongle body + plug -->
    <rect x="1.95" y="25.55" width="23" height="56" rx="1.5" fill="#22252B"/>
    <rect x="5.5" y="11.55" width="16" height="14" rx="1" fill="#3A3F47"/>
    <line x1="1.95" y1="81.55" x2="25.05" y2="81.55" stroke="#FF6B2C" stroke-width=".3" stroke-dasharray="1 .8"/>
    <!-- dims -->
    <line class="dim" x1="-6" y1="0" x2="-6" y2="100"/><text x="-8" y="50" class="m" text-anchor="middle" transform="rotate(-90 -8 50)">100 outside</text>
    <line class="dim" x1="0" y1="106" x2="25.5" y2="106"/><text x="12.75" y="111" class="m" text-anchor="middle">25.5 outside · ~24.6 inside</text>
    <line class="dim" x1="31" y1="73.55" x2="31" y2="99.55"/><text x="33" y="87" class="m">riser 26</text>
    <line class="dim" x1="31" y1="73.55" x2="31" y2="81.55" style="stroke:#C94C17"/><text x="33" y="77.5" class="m">dongle sits 8 deep</text>
    <line class="dim" x1="31" y1="25.55" x2="31" y2="73.55"/><text x="33" y="50" class="m">body 56 (8 hidden)</text>
    <line class="dim" x1="31" y1="11.55" x2="31" y2="25.55"/><text x="33" y="19" class="m">plug 14</text>
    <line class="dim" x1="31" y1="0" x2="31" y2="11.55"/><text x="33" y="6.5" class="m">11 headroom</text>
    <text x="-2" y="-1.5" class="m" text-anchor="end">back</text><text x="27.5" y="-1.5" class="m">front</text>
  </g>

  <!-- ===== FRONT VIEW ===== -->
  <g transform="translate(125 40)">
    <text x="0" y="-6" class="t" font-weight="600">Front view, box front removed</text>
    <rect x="0" y="0" width="63" height="100" fill="none" stroke="#14171C" stroke-width=".9"/>
    <rect x="0.5" y="13.55" width="62" height="86" fill="#FF6B2C" opacity=".35"/>
    <path d="M20.5 13.55 v-6 a5 5 0 0 1 5 -5 h12 a5 5 0 0 1 5 5 v6 z" fill="#FF6B2C"/>
    <text x="31.5" y="10" text-anchor="middle" font-family="Sora" font-weight="700" font-size="2.4" fill="#14171C">PULL</text>
    <rect x="2.5" y="4.55" width="58" height="95" fill="#14171C" opacity=".25"/>
    <rect x="0.5" y="73.55" width="62" height="26" fill="#FF6B2C"/>
    <rect x="8.5" y="25.55" width="46" height="56" rx="2" fill="#22252B"/>
    <rect x="12" y="11.55" width="39" height="14" rx="1.2" fill="#3A3F47"/>
    <rect x="8.25" y="73.55" width="46.5" height="8" fill="none" stroke="#C94C17" stroke-width=".4" stroke-dasharray="1 .8"/>
    <line class="dim" x1="0" y1="106" x2="63" y2="106"/><text x="31.5" y="111" class="m" text-anchor="middle">63 outside · insert 62</text>
    <line class="dim" x1="8.5" y1="88" x2="54.5" y2="88"/><text x="31.5" y="93" class="m" text-anchor="middle">cut-out 46.5 × 23.5</text>
    <line class="dim" x1="12" y1="30" x2="51" y2="30" style="stroke:#9AA0A8"/><text x="31.5" y="34" class="m" text-anchor="middle" style="fill:#C9CDD3">plug 39</text>
  </g>

  <!-- ===== NOTES ===== -->
  <g transform="translate(210 40)">
    <text x="0" y="-6" class="t" font-weight="600">Stacking, back to front</text>
    <g class="s">
      <rect x="0" y="0" width="4" height="4" fill="#14171C"/><text x="7" y="3.4" class="t">Upgrade card, 95 × 58</text>
      <text x="7" y="7.6">Against the box back panel. Its top shows above</text>
      <text x="7" y="11">the orange wall when the flap opens.</text>
      <rect x="0" y="16" width="4" height="4" fill="#FF6B2C"/><text x="7" y="19.4" class="t">Orange back wall + PULL tab</text>
      <text x="7" y="23.6">One die-cut card. 86 tall wall, 10 mm tab on top.</text>
      <rect x="0" y="30" width="4" height="4" fill="#5E636B"/><text x="7" y="33.4" class="t">Sticker, Ø 50</text>
      <text x="7" y="37.6">In front of the orange wall, behind the dongle.</text>
      <rect x="0" y="43" width="4" height="4" fill="#FF6B2C" stroke="#C94C17" stroke-width=".3"/><text x="7" y="46.4" class="t">Orange riser block, 62 × 26 × 23</text>
      <text x="7" y="50.6">Folded from the same card as the wall, with a</text>
      <text x="7" y="54">46.5 × 23.5 hole that grips the dongle 8 mm deep.</text>
      <rect x="0" y="60" width="4" height="4" fill="#22252B"/><text x="7" y="63.4" class="t">Dongle, label facing the front</text>
      <text x="7" y="67.6">Plug points up, so it lifts out by the plug.</text>
    </g>
    <text x="0" y="80" class="warn">ASSUMED: dongle 46 × 56 × 23 body, 39 × 14 × 16 plug.</text>
    <text x="0" y="84.5" class="warn">If the body is deeper than 23.5 mm it will not fit</text>
    <text x="0" y="89" class="warn">with the card behind it. Then move the card under</text>
    <text x="0" y="93.5" class="warn">the riser, folded, or make the box 27 mm deep.</text>
  </g>
</svg>
