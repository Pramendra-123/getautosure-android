<!doctype html>
<meta charset="utf-8">
<title>GetAutoSure packaging – vendor pack</title>
<link rel="stylesheet" href="fonts.css">
<style>
  @page { size: 297mm 210mm; margin: 0 }
  html, body { margin: 0; background: #fff; color: #14171C; font: 10pt/1.45 "IBM Plex Sans", "Microsoft YaHei", sans-serif }
  .page { width: 297mm; height: 210mm; box-sizing: border-box; padding: 12mm 14mm; page-break-after: always; position: relative; overflow: hidden }
  .page:last-child { page-break-after: auto }
  h1 { font: 700 22pt/1.1 Sora, sans-serif; margin: 0 0 2mm }
  h2 { font: 700 15pt/1.15 Sora, sans-serif; margin: 0 0 4mm }
  .sub { color: #5E636B; margin: 0 0 6mm }
  .zh { color: #5E636B; font-size: 9pt }
  .foot { position: absolute; left: 14mm; right: 14mm; bottom: 7mm; display: flex; justify-content: space-between; font: 8pt "IBM Plex Mono", monospace; color: #8A9099 }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6mm }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4mm }
  img { width: 100%; display: block; border-radius: 2mm }
  table { border-collapse: collapse; width: 100%; font-size: 9.5pt }
  td, th { text-align: left; vertical-align: top; padding: 1.6mm 2mm; border-bottom: 0.2mm solid #E2DED8 }
  th { font: 600 8pt "IBM Plex Mono", monospace; color: #5E636B; text-transform: uppercase; letter-spacing: .04em }
  td:first-child { font-weight: 600; white-space: nowrap }
  .ok { color: #1E7B34; font-weight: 600 }
  .new { color: #D4500F; font-weight: 600 }
  .cap { font: 8pt "IBM Plex Mono", monospace; color: #5E636B; margin: 1.5mm 0 0 }
  .art { display: flex; flex-wrap: wrap; gap: 8mm 10mm; align-items: flex-start }
  .art figure { margin: 0 }
  .art svg { display: block }
  ol { margin: 0; padding-left: 5mm } li { margin-bottom: 2mm }
  .swatch { display: inline-block; width: 3.5mm; height: 3.5mm; border-radius: .6mm; vertical-align: -0.5mm; margin-right: 1.5mm }
</style>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="art.js"></script>
<script>
const A = ART, F = A.flat, Q = A.quiet;
// one artwork panel at 1:1 (mm) with 3 mm bleed shown as a dark margin and the trim line in magenta
const panel = (w, h, body, cap, bg = A.INK) => `<figure>
  <svg width="${w + 6}mm" height="${h + 6}mm" viewBox="-3 -3 ${w + 6} ${h + 6}">
    <rect x="-3" y="-3" width="${w + 6}" height="${h + 6}" fill="${bg}"/>${body}
    <rect x="0" y="0" width="${w}" height="${h}" fill="none" stroke="#EC008C" stroke-width="0.2"/></svg>
  <figcaption class="cap">${cap}</figcaption></figure>`;
const foot = n => `<div class="foot"><span>GetAutoSure · OBD-II scanner V02H4 · packaging v2 · 2 Nov 2026</span><span>${n} / 6</span></div>`;

const cardBack = `<rect width="95" height="58" fill="#fff"/>
  <text x="6" y="10" font-family="Sora" font-weight="700" font-size="4" fill="${A.INK}">Where's my OBD port?</text>
  <g fill="none" stroke="${A.INK}" stroke-width="0.5" stroke-linecap="round">
    <path d="M6 28 q22 -9 44 0"/><circle cx="37" cy="29" r="7"/><circle cx="37" cy="29" r="1.6"/><path d="M37 36 v6"/><path d="M30 45 h4 M40 45 h4"/></g>
  <rect x="40" y="36.5" width="7" height="4.2" rx="0.8" fill="${A.ORANGE}"/><path d="M50 38.5 h4" stroke="${A.ORANGE}" stroke-width="0.5"/>
  <text x="55" y="39.4" font-family="IBM Plex Sans" font-size="2" fill="${A.INK}">Usually here</text>
  <g font-family="IBM Plex Sans" font-size="2.3" fill="#3B4048">
    <text x="57" y="18">Under the dashboard,</text><text x="57" y="22">near your right knee.</text>
    <text x="57" y="28">Sometimes behind a</text><text x="57" y="32">small cover or fuse lid.</text></g>
  <line x1="6" y1="49" x2="89" y2="49" stroke="#E2DED8" stroke-width="0.3"/>
  <text x="6" y="54" font-family="IBM Plex Sans" font-size="2.1" fill="#3B4048">Help: getautosure.com/help · WhatsApp [number]</text>`;

// orange insert, top view: 100 x 82 printed with a 5 mm black border, 47 x 67 cut-out, thumb notch on the right
const insert = `<svg width="118mm" height="100mm" viewBox="-12 -4 118 100" font-family="IBM Plex Mono">
  <rect x="0" y="0" width="100" height="82" fill="#0C0D0F"/>
  <rect x="5" y="5" width="90" height="72" fill="${A.ORANGE}"/>
  <rect x="26.5" y="7.5" width="47" height="67" fill="#B9461A" stroke="#EC008C" stroke-width="0.3" stroke-dasharray="1.2 .8"/>
  <path d="M73.5 35 a6 6 0 0 1 0 12 z" fill="#B9461A" stroke="#EC008C" stroke-width="0.3" stroke-dasharray="1.2 .8"/>
  <text x="50" y="39" text-anchor="middle" font-size="2.6" fill="#fff">CUT-OUT 47 × 67</text>
  <text x="50" y="43" text-anchor="middle" font-size="2" fill="#fff">dongle 45 × 65 face up</text>
  <text x="50" y="12" text-anchor="middle" font-size="2" fill="#fff">▲ plug toward the hinge</text>
  <text x="85" y="40.5" text-anchor="middle" font-size="2" fill="#fff">thumb</text><text x="85" y="43.5" text-anchor="middle" font-size="2" fill="#fff">notch R6</text>
  <text x="2.5" y="45" text-anchor="middle" font-size="1.8" fill="#8C9199" transform="rotate(-90 2.5 41)">5 mm black border</text>
  <g stroke="#5E636B" stroke-width="0.25"><line x1="0" y1="88" x2="100" y2="88"/><line x1="0" y1="86.5" x2="0" y2="89.5"/><line x1="100" y1="86.5" x2="100" y2="89.5"/>
    <line x1="-6" y1="0" x2="-6" y2="82"/><line x1="-7.5" y1="0" x2="-4.5" y2="0"/><line x1="-7.5" y1="82" x2="-4.5" y2="82"/></g>
  <text x="50" y="93" text-anchor="middle" font-size="2.6" fill="#5E636B">100</text>
  <text x="-8" y="41" text-anchor="middle" font-size="2.6" fill="#5E636B" transform="rotate(-90 -8 41)">82</text>
</svg>`;

const svgOnly = (w, h, body) => `<svg width="${w}mm" height="${h}mm" viewBox="0 0 ${w} ${h}">${body}</svg>`;
const in86 = body => `<g transform="translate(0 3)">${body}</g>`;
const side = body => `<g transform="translate(3 0)">${body}</g>`;
const img = (f, cap) => `<figure style="margin:0"><img src="views-v2/${f}"><figcaption class="cap">${cap}</figcaption></figure>`;

document.getElementById("root").innerHTML = `
<section class="page">
  <h1>GetAutoSure packaging</h1>
  <p class="sub">For OBD-II scanner model <b>V02H4</b>. Flat flip-lid box, black outside, orange tray inside. <span class="zh">翻盖盒 · 黑色外观 · 橙色内托</span></p>
  <div class="grid2" style="grid-template-columns: 1.15fr 1fr">
    <div class="grid2" style="gap:4mm">
      ${img("box-open.png", "Open")}
      ${img("box-top.png", "Closed, top")}
      ${img("box-back.png", "Back: features")}
      ${img("dongle-vertical.png", "Dongle silk-screen")}
    </div>
    <table>
      <tr><th colspan="2">Box specification · 包装规格</th></tr>
      <tr><td>Style 盒型</td><td>Flip-lid folding carton (lid hinged at back, tuck flap at front), no window<br><span class="zh">翻盖折叠盒，无开窗</span></td></tr>
      <tr><td>Outside size 尺寸</td><td>104 × 86 × 30 mm (W × D × H)</td></tr>
      <tr><td>Board 材质</td><td>350 g C2S art card (coated both sides) <span class="zh">350g 双粉卡</span></td></tr>
      <tr><td>Print 印刷</td><td>4-colour outside + inside (inside lid and tray walls black) <span class="zh">四色印刷（外面 + 盖内）</span></td></tr>
      <tr><td>Finish 工艺</td><td>Soft-touch matte lamination outside <span class="zh">触感哑膜</span>. Optional: spot UV on the logo <span class="zh">局部UV（可选）</span></td></tr>
      <tr><td>Insert 内托</td><td>Die-cut card 100 × 82, printed 5 mm black border + orange field, cut-out 47 × 67, 1 thumb notch. Sits 4 mm below the rim, dongle flush. <span class="zh">刀模内托，印黑边 + 橙色</span></td></tr>
      <tr><td>Colours 颜色</td><td><span class="swatch" style="background:#14171C"></span>Black #14171C &nbsp; <span class="swatch" style="background:#FF6B2C"></span>Orange #FF6B2C (≈ Pantone 1585 C, please send proof)</td></tr>
      <tr><td>Contents 内容</td><td>1 × scanner (in insert) · 1 × card 95 × 58 · 1 × sticker Ø 50 (both under the insert)</td></tr>
      <tr><td>Dongle 产品</td><td>V02H4, 45 × 25 × 65 mm. Silk-screen 2 colours (white + orange), no label. Bluetooth name "GetAutoSure".</td></tr>
    </table>
  </div>
  ${foot(1)}
</section>

<section class="page">
  <h2>All sides · 六面效果图</h2>
  <div class="grid3">
    ${img("box-front.png", "Front: plain")}
    ${img("box-back.png", "Back: 4 features")}
    ${img("box-left.png", "Left: \"Don't guess. Be sure.\"")}
    ${img("box-right.png", "Right: plain, for Amazon barcode sticker")}
    ${img("box-top.png", "Top (lid)")}
    ${img("box-bottom.png", "Bottom: regulatory details")}
  </div>
  ${foot(2)}
</section>

<section class="page">
  <h2>Artwork at 100% · 1:1 印刷稿</h2>
  <p class="sub">Magenta line = finished size. 3 mm bleed around each panel. Please place on your die. <span class="zh">品红线为成品尺寸，四周出血3mm，请按贵司刀模排版。</span></p>
  <div class="art">
    ${panel(104, 86, in86(Q.lidTop()), "LID TOP 盖面 · 104 × 86")}
    ${panel(104, 86, in86(Q.lidInside()), "INSIDE LID 盖内 · 104 × 86")}
    ${panel(104, 30, Q.frontWall(), "FRONT 正面 · 104 × 30 · plain")}
    ${panel(104, 30, Q.backWall(), "BACK 背面 · 104 × 30")}
  </div>
  ${foot(3)}
</section>

<section class="page">
  <h2>Artwork at 100% · continued</h2>
  <div class="art">
    ${panel(104, 86, in86(F.bottom()), "BOTTOM 底面 · 104 × 86 · regulatory text, fill [ ] before print")}
    <div style="display:grid;gap:8mm">
      ${panel(86, 30, side(Q.leftWall()), "LEFT 左侧 · 86 × 30")}
      ${panel(86, 30, side(Q.rightWall()), "RIGHT 右侧 · 86 × 30 · plain for Amazon FNSKU label")}
    <figure style="display:flex;gap:5mm;align-items:center"><div style="background:#2a2d33;padding:3mm;border-radius:2mm;width:max-content">${A.labelMinimal()}</div>
      <figcaption class="cap">DONGLE SILK-SCREEN 丝印 · 42 × 50.6<br>white + orange · plug at the top<br>LED dots over the existing LED holes</figcaption></figure>
    </div>
  </div>
  ${foot(4)}
</section>

<section class="page">
  <h2>Insert, card and sticker · 内托、卡片、贴纸</h2>
  <div class="art">
    <div style="display:grid;gap:5mm"><figure>${insert}<figcaption class="cap">INSERT 内托 · top view · cut-out and notch dashed</figcaption></figure>
    <figure style="display:flex;gap:5mm;align-items:center">${svgOnly(50, 50, A.sticker())}<figcaption class="cap">STICKER 贴纸 · Ø 50<br>clear static cling, reverse print<br>(stick inside glass) 静电贴，反印</figcaption></figure></div>
    <div style="display:grid;gap:6mm">
      <figure>${svgOnly(95, 58, A.cardFront())}<figcaption class="cap">CARD FRONT 卡片正面 · 95 × 58 · 300 g, matte</figcaption></figure>
      <figure><div style="outline:0.2mm solid #DDD8D2;width:max-content">${svgOnly(95, 58, cardBack)}</div><figcaption class="cap">CARD BACK 卡片背面</figcaption></figure>
    </div>
  </div>
  ${foot(5)}
</section>

<section class="page">
  <h2>Requests · 需求确认</h2>
  <div class="grid2">
    <div>
      <table>
        <tr><th>Item</th><th>Status</th></tr>
        <tr><td>Bluetooth name "GetAutoSure"<br><span class="zh">蓝牙名称改为 GetAutoSure</span></td><td class="ok">Agreed</td></tr>
        <tr><td>Silk-screen dongle face (page 4)<br><span class="zh">外壳丝印（见第4页）</span></td><td class="ok">Agreed</td></tr>
        <tr><td>CE / FCC / RoHS test reports for V02H4<br><span class="zh">V02H4 的 CE/FCC/RoHS 测试报告</span></td><td class="ok">Agreed</td></tr>
        <tr><td>Flip-lid box 104 × 86 × 30, 350 g C2S<br><span class="zh">翻盖盒 + 新刀模</span></td><td class="new">Please quote</td></tr>
        <tr><td>Printed die-cut insert<br><span class="zh">印刷内托</span></td><td class="new">Please quote</td></tr>
        <tr><td>Card 95 × 58 (2 sides) + sticker Ø 50<br><span class="zh">卡片 + 贴纸</span></td><td class="new">Please quote</td></tr>
      </table>
    </div>
    <div>
      <h3 style="font:600 11pt Sora,sans-serif;margin:0 0 3mm">Questions · 问题</h3>
      <ol>
        <li>One-time cost of the new cutting die, and unit price at our quantity. <span class="zh">刀模费及单价？</span></li>
        <li>MOQ for box, insert, card and sticker. <span class="zh">各项起订量？</span></li>
        <li>Please send a printed physical sample (proof) before mass production, especially the orange. <span class="zh">量产前请寄实物打样，尤其橙色。</span></li>
        <li>Please send one silk-screened dongle sample to check the LED alignment. <span class="zh">请寄一个丝印样品，确认指示灯位置。</span></li>
        <li>Lead time for sample and for production. <span class="zh">打样及生产周期？</span></li>
      </ol>
      <p class="cap" style="margin-top:6mm">Bottom-panel details in [brackets] will be filled in before final print files.</p>
    </div>
  </div>
  ${foot(6)}
</section>`;

</script>
