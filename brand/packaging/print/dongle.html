<!doctype html>
<meta charset="utf-8">
<title>GetAutoSure dongle render</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono&display=swap">
<style>
  html,body{margin:0;width:1600px;height:1000px;overflow:hidden}
  body{background:radial-gradient(ellipse 70% 60% at 50% 45%, #EDEBE8 0%, #D6D2CC 55%, #BDB7AF 100%)}
  .stage{position:absolute;inset:0;perspective:2400px;perspective-origin:50% 30%}
  .world{position:absolute;left:50%;top:55%;transform-style:preserve-3d;transform:rotateX(-30deg) rotateY(-28deg)}
  .obj{position:absolute;left:0;top:0;transform-style:preserve-3d}
  .f{position:absolute;left:0;top:0;overflow:hidden}
  .f svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  .f i{position:absolute;inset:0;pointer-events:none}
  .shadow{position:absolute;left:0;top:0;border-radius:60px;filter:blur(22px)}
  .flat{position:absolute;right:90px;top:50%;transform:translateY(-50%);text-align:center;font:13px "IBM Plex Mono",monospace;color:#5E636B}
  .flat svg{width:330px;height:auto;display:block;margin-bottom:12px;border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
</style>
<div class="stage"><div class="world" id="world"></div></div>
<div class="flat" id="flat"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="art.js"></script>
<script>
// V02H4 lying face up, plug on the left, with the landscape silk-screen. 1 mm = 9 px.
const A = ART, k = 9, SHELL = "#141619";
function face(w, h, t, content, bg, shade = "transparent", r = 0) {
  return `<div class="f" style="width:${w}px;height:${h}px;margin:${-h / 2}px 0 0 ${-w / 2}px;transform:${t};background:${bg};border-radius:${r}px">${content}<i style="background:${shade}"></i></div>`;
}
const place = (x, y, z, html) => `<div class="obj" style="transform:translate3d(${x}px,${y}px,${z}px)">${html}</div>`;
function cuboid(W, H, D, top, r = 0) {
  return face(W, H, `translateZ(${D / 2}px)`, "", SHELL, "linear-gradient(180deg, rgba(255,255,255,.05), rgba(0,0,0,.35))", r) +
    face(D, H, `rotateY(90deg) translateZ(${W / 2}px)`, "", SHELL, "rgba(0,0,0,.45)", r) +
    face(D, H, `rotateY(-90deg) translateZ(${W / 2}px)`, "", SHELL, "rgba(0,0,0,.5)", r) +
    face(W, D, `rotateX(90deg) translateZ(${H / 2}px)`, top, SHELL, "linear-gradient(160deg, rgba(255,255,255,.10), rgba(0,0,0,.18))", r);
}
const art = A.labelMinimal().replace('width="42mm" height="50.6mm"', 'width="100%" height="100%" preserveAspectRatio="xMidYMid meet"');
const lbl = `<div style="position:absolute;inset:${0.6 * k}px ${2 * k}px">${art}</div>`;
const shadow = `<div class="shadow" style="width:${80 * k}px;height:${60 * k}px;margin:${-30 * k}px 0 0 ${-40 * k}px;transform:rotateX(90deg);background:rgba(40,30,20,.45)"></div>`;
document.getElementById("world").innerHTML =
  `<div class="obj" style="transform:translateX(-260px)">` +
  place(0, 12.5 * k + 2, 0, shadow) +
  place(0, 0, 7.5 * k, cuboid(46 * k, 25 * k, 50 * k, lbl, 5)) +
  place(0, 0, -25 * k, cuboid(39 * k, 16 * k, 15 * k, "", 4)) +
  `</div>`;
document.getElementById("flat").innerHTML = A.labelMinimal() + "Silk-screen artwork · 42 × 50.6 mm · plug at the top";
</script>
