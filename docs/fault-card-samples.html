<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fault Card Samples</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF7F2; --card: #141414; --card2: #1F1F1F; --text: #F5F5F5; --muted: #A8A8A8;
    --ink: #1A1A1A; --ink-muted: #6B6B6B; --orange: #F26B1D; --line: #2C2C2C;
    --stop: #E5484D; --now: #F26B1D; --soon: #E6B422; --wait: #3FB27F;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: Inter, "Noto Sans Devanagari", system-ui, sans-serif; line-height: 1.5; }
  body.hi { font-family: "Noto Sans Devanagari", Inter, system-ui, sans-serif; }
  header { max-width: 1100px; margin: 0 auto; padding: 28px 16px 8px; }
  h1 { margin: 0 0 4px; font-size: 26px; }
  h1 span { color: var(--orange); }
  .sub { color: var(--ink-muted); margin: 0 0 16px; font-size: 14px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .toggle button { border: 1.5px solid var(--ink); background: transparent; color: var(--ink); padding: 6px 16px; font: inherit; font-weight: 600; cursor: pointer; }
  .toggle button:first-child { border-radius: 999px 0 0 999px; }
  .toggle button:last-child { border-radius: 0 999px 999px 0; border-left: none; }
  .toggle button.on { background: var(--ink); color: #fff; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; margin-left: auto; }
  .grid { max-width: 1100px; margin: 0 auto; padding: 12px 16px 40px; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 480px), 1fr)); gap: 16px; }
  .card { background: var(--card); color: var(--text); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .code { background: var(--orange); color: #fff; font-weight: 700; border-radius: 8px; padding: 2px 10px; font-size: 14px; letter-spacing: .5px; }
  .pill { border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 700; color: #111; }
  .fuel { border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 1px 8px; font-size: 11px; }
  .title { font-size: 19px; font-weight: 700; margin: 0; }
  .tech { color: var(--muted); font-size: 12px; margin-top: -8px; }
  .meaning { margin: 0; font-size: 14.5px; }
  h3 { margin: 0 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--orange); }
  body.hi h3 { text-transform: none; letter-spacing: 0; font-size: 13px; }
  ul, ol { margin: 0; padding-left: 20px; font-size: 14px; }
  li { margin: 2px 0; }
  .tag { background: var(--orange); color: #fff; border-radius: 6px; font-size: 10.5px; font-weight: 700; padding: 0 6px; margin-left: 4px; white-space: nowrap; }
  .box { background: var(--card2); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
  .box.drive { border-left: 3px solid var(--orange); }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  td { padding: 5px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.r { text-align: right; white-space: nowrap; font-weight: 600; padding-left: 12px; }
  tr:last-child td { border-bottom: none; }
  .india { font-size: 13.5px; color: #FFD9C2; }
  .india b { color: var(--orange); }
  footer { max-width: 1100px; margin: 0 auto; padding: 0 16px 40px; color: var(--ink-muted); font-size: 12.5px; }
</style>
</head>
<body>
<header>
  <h1>Fault-code cards: <span>10 samples</span></h1>
  <p class="sub" id="sub"></p>
  <div class="bar">
    <div class="toggle"><button id="b-en" class="on">English</button><button id="b-hi">हिंदी</button></div>
    <div class="legend" id="legend"></div>
  </div>
</header>
<main class="grid" id="grid"></main>
<footer id="foot"></footer>

let lang = "en";
const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const t = o => esc(o[lang]);

function render() {
  document.body.classList.toggle("hi", lang === "hi");
  document.documentElement.lang = lang;
  document.getElementById("sub").textContent = UI.sub[lang];
  document.getElementById("foot").textContent = UI.foot[lang];
  document.getElementById("legend").innerHTML = Object.values(URGENCY)
    .map(u => `<span class="pill" style="background:${u.c}">${t(u.l)}</span>`).join("");
  document.getElementById("grid").innerHTML = CARDS.map(c => {
    const u = URGENCY[c.urgency];
    return `<article class="card">
      <div class="top"><span class="code">${c.code}</span>
        <span class="pill" style="background:${u.c}">${t(u.l)}</span>
        ${c.fuel.map(f => `<span class="fuel">${f}</span>`).join("")}</div>
      <p class="title">${t(c.title)}</p>
      <div class="tech">${esc(c.tech)}</div>
      <p class="meaning">${t(c.meaning)}</p>
      <div><h3>${t(UI.notice)}</h3><ul>${c.notice.map(n => `<li>${t(n)}</li>`).join("")}</ul></div>
      <div><h3>${t(UI.causes)}</h3><ol>${c.causes.map((x, i) => `<li>${t(x)}${i === 0 ? `<span class="tag">${t(UI.most)}</span>` : ""}</li>`).join("")}</ol></div>
      <div class="box drive"><h3>${t(UI.drive)}</h3>${t(c.drive)}</div>
      <div class="box"><h3>${t(UI.first)}</h3>${t(c.first)}</div>
      <div><h3>${t(UI.cost)}</h3><table>${c.costs.map(([p, r]) => `<tr><td>${t(p)}</td><td class="r">${r}</td></tr>`).join("")}</table></div>
      <div class="india"><b>${t(UI.india)}:</b> ${t(c.india)}</div>
    </article>`;
  }).join("");
  document.getElementById("b-en").classList.toggle("on", lang === "en");
  document.getElementById("b-hi").classList.toggle("on", lang === "hi");
}
document.getElementById("b-en").onclick = () => { lang = "en"; render(); };
document.getElementById("b-hi").onclick = () => { lang = "hi"; render(); };
render();
